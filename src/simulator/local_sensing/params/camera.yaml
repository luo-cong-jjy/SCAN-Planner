# 备用针孔相机参数文件，当前默认 launch 没有加载它。
# 只有显式 rosparam load 或新增 launch 加载后才影响参数；需与建图端的内参、图像尺寸对应。
# 图像宽度，单位 px。
cam_width:  640
# 图像高度，单位 px。
cam_height: 480
# 水平焦距，单位 px，须为正。
cam_fx:     387.229248046875
# 垂直焦距，单位 px，须为正。
cam_fy:     387.229248046875
# 主点水平坐标，单位 px。
cam_cx:     321.04638671875
# 主点垂直坐标，单位 px。
cam_cy:     243.44969177246094
